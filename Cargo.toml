[package]
name = "gerenuk"
version = "0.1.0"
edition = "2021"
description = "Symbol-level Python code intelligence on top of ty-find"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mojzis/gerenuk"
keywords = ["python", "lsp", "static-analysis", "symbols", "cli"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "color"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8.0"
tree-sitter = "0.26.13"
tree-sitter-python = "0.25.0"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.26"
assert_cmd = "2.2"
predicates = "3.1"
insta = "1.48.0"
serde_json = "1.0"
which = "8.0"

[lib]
name = "gerenuk"
path = "src/lib.rs"

[[bin]]
name = "gerenuk"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Cherry-picked restriction lints
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
clone_on_ref_ptr = "warn"
exit = "warn"
await_holding_lock = "warn"
large_futures = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"

# Cargo group allows
multiple_crate_versions = "allow"

# Pedantic allows (too noisy)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
implicit_hasher = "allow"

# Nursery allows (unstable/buggy lints)
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
