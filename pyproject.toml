[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gerenuk"
description = "Symbol-level Python code intelligence, powered by ty-find"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mojzis", email = "mojzisek@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["python", "lsp", "symbols", "static-analysis", "rust"]
dynamic = ["version"]
# `tyf` is not optional — every command except `changed-symbols` shells out to
# it — so installing gerenuk installs it. `ty` itself is deliberately *not* a
# hard dependency; see the `ty` extra below.
dependencies = [
    "ty-find>=0.4",
]

[project.urls]
homepage = "https://github.com/mojzis/gerenuk"
repository = "https://github.com/mojzis/gerenuk"
documentation = "https://mojzis.github.io/gerenuk"

[project.optional-dependencies]
# `pip install gerenuk[ty]` for a complete, offline-capable setup.
#
# `ty` is an extra rather than a dependency on purpose: it is a pre-1.0 type
# checker that projects pin themselves, and a hard requirement here would fight
# that pin for no gain — `tyf` falls back to `uvx ty` when it finds none on
# PATH. ty-find made the same call for the same reason.
ty = [
    "ty",
]
dev = [
    "pytest>=8.0",
]

[tool.maturin]
bindings = "bin"
strip = true
