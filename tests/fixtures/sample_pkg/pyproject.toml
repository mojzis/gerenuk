[project]
name = "sample-pkg"
version = "0.1.0"
description = "Fixture package for gerenuk integration tests"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.gerenuk]
# `normalise_species` is invoked by the registry runner, never called, so a
# change to it has no callers to chase.
ignore-decorators = ["registry.transformation"]
