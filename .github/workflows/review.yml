name: Code Review

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "rustfmt.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "scripts/**"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - "rustfmt.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite stubs `tyf` via GERENUK_TYF, so neither ty-find nor ty is
      # needed here. See tests/common/mod.rs.
      - run: cargo test --all-features

  fixture:
    name: Fixture package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Run the fixture package's pytest suite
        working-directory: tests/fixtures/sample_pkg
        run: uv run --with pytest --with hatchling python -m pytest -q

  impact:
    name: impacted-tests against real tyf
    runs-on: ubuntu-latest
    # Advisory: this is the only job that drives a real `ty` language server, so
    # it is the only place upstream drift in tyf's wire format shows up. It must
    # not block a PR that did not cause the drift.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install ty and ty-find
        run: uv tool install ty-find --with ty
      - run: cargo build
      - run: make test-impact

  docs:
    name: Docs are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version badge matches Cargo.toml
        run: bash docs/gen-version.sh --check
      - name: Shared snippets are injected
        run: bash docs/inject-shared.sh --check
